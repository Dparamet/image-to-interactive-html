<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive UI Prototype Demo — image-to-interactive-html</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: 'Prompt', 'Inter', sans-serif;
      color: #f8fafc;
      overflow: hidden;
      padding: 24px;
    }

    /* Card Container */
    .card {
      width: 400px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
    }

    .desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      font-family: 'Inter', sans-serif;
    }

    .cta-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    /* Draggable Mechanics */
    .draggable-item {
      cursor: grab;
      user-select: none;
      touch-action: none;
      position: relative;
      will-change: transform;
    }
    .draggable-item:hover {
      outline: 1px dashed rgba(56, 189, 248, 0.45);
      outline-offset: 3px;
    }
    .draggable-item.is-dragging {
      cursor: grabbing;
      z-index: 9999 !important;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), 0 0 0 2px rgba(59, 130, 246, 0.75);
      outline: none;
      transition: none !important;
    }
    .draggable-item.is-resetting {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
  </style>
</head>
<body>

  <!-- Floating Toolbar -->
  <div id="floating-toolbar" style="position:fixed;top:16px;right:16px;z-index:10000;display:flex;align-items:center;gap:12px;background:rgba(15,23,42,0.9);backdrop-filter:blur(8px);color:#f8fafc;padding:8px 14px;border-radius:9999px;font-family:monospace;font-size:13px;border:1px solid rgba(255,255,255,0.12);box-shadow:0 4px 16px rgba(0,0,0,0.3);">
    <span id="coord-readout">X: 0, Y: 0</span>
    <button id="reset-layout-btn" style="background:#3b82f6;color:#fff;border:none;padding:5px 12px;border-radius:9999px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;">Reset Layout</button>
  </div>

  <!-- Interactive UI Prototype -->
  <div class="card draggable-item">
    <div class="card-header">
      <div class="icon-btn draggable-item" title="Drag me independently!">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </div>
      <span class="badge draggable-item">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="4"/></svg>
        Interactive Mode
      </span>
    </div>

    <h1 class="title draggable-item">ลองคลิกลากทุกชิ้นส่วนในหน้านี้ได้เลย</h1>

    <p class="desc draggable-item">
      คุณสามารถลากเฉพาะปุ่ม หัวข้อ ป้ายสถานะ หรือลากทั้งการ์ดได้อย่างอิสระ พร้อมดูพิกัด (X, Y) มุมขวาบน และกด Reset Layout เพื่อกลับจุดเริ่มต้น
    </p>

    <div class="stat-box draggable-item">
      <div>
        <div class="stat-label draggable-item">DRAG ENGINE</div>
        <div class="stat-value draggable-item">Pointer API 60fps</div>
      </div>
      <div class="icon-btn draggable-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 9 2 12 5 15"></polyline>
          <polyline points="9 5 12 2 15 5"></polyline>
          <polyline points="15 19 12 22 9 19"></polyline>
          <polyline points="19 9 22 12 19 15"></polyline>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="12" y1="2" x2="12" y2="22"></line>
        </svg>
      </div>
    </div>

    <button class="cta-btn draggable-item" type="button">
      <span>ยืนยันตำแหน่ง UI (Confirm Layout)</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

  <script>
    (() => {
      const coordReadout = document.getElementById('coord-readout');
      const resetBtn = document.getElementById('reset-layout-btn');
      let highestZ = 100;

      document.querySelectorAll('.draggable-item').forEach((el) => {
        el.dataset.x = el.dataset.x || '0';
        el.dataset.y = el.dataset.y || '0';

        let startX = 0, startY = 0, initialX = 0, initialY = 0;

        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          e.stopPropagation();
          el.classList.remove('is-resetting');
          el.classList.add('is-dragging');
          el.style.zIndex = ++highestZ;

          initialX = parseFloat(el.dataset.x) || 0;
          initialY = parseFloat(el.dataset.y) || 0;
          startX = e.clientX;
          startY = e.clientY;

          el.setPointerCapture(e.pointerId);
          coordReadout.textContent = `X: ${Math.round(initialX)}, Y: ${Math.round(initialY)}`;
        });

        el.addEventListener('pointermove', (e) => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const newX = initialX + dx;
          const newY = initialY + dy;

          el.dataset.x = newX;
          el.dataset.y = newY;
          el.style.transform = `translate3d(${newX}px, ${newY}px, 0)`;
          coordReadout.textContent = `X: ${Math.round(newX)}, Y: ${Math.round(newY)}`;
        });

        const endDrag = (e) => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          el.releasePointerCapture(e.pointerId);
          el.classList.remove('is-dragging');
        };

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);
      });

      resetBtn.addEventListener('click', () => {
        document.querySelectorAll('.draggable-item').forEach((el) => {
          el.classList.add('is-resetting');
          el.dataset.x = '0';
          el.dataset.y = '0';
          el.style.transform = 'translate3d(0px, 0px, 0)';
          el.style.zIndex = '';
        });
        coordReadout.textContent = 'X: 0, Y: 0';
      });
    })();
  </script>
</body>
</html>
